name: Verify repository and results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Install verification dependency
        run: python -m pip install numpy==2.5.3
      - name: Check repository files and links
        run: python -m research.kuki.check_repository
      - name: Recompute published metrics and intervals
        run: python -m research.kuki.verify_results
