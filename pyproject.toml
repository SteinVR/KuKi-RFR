[project]
name = "kuki-rfr"
version = "0.1.0"
description = "Modeling Participant Roles, Frames, and Rhetoric in Russian-Language News"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.5.3,<3",
  "pandas>=3.0.6,<3.1",
  "scipy>=1.18.1,<2",
  "scikit-learn>=1.9.1,<2",
  "matplotlib>=3.11.2,<4",
  "iterative-stratification>=0.1.9,<0.2",
  "razdel==0.5.0",
]

[dependency-groups]
train = [
  "torch==2.12.1",
  "transformers>=5.17,<5.18",
  "peft>=0.21,<0.22",
  "accelerate>=1.15,<1.16",
  "safetensors>=0.8,<1",
  "tokenizers>=0.23.2,<0.24",
  "kernels==0.16.0",
]
notebooks = ["ipykernel>=6.30,<8", "jupyterlab>=4.4,<5"]
dev = [
    "optuna==5.0.0",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
default-groups = ["dev", "train"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["research/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
